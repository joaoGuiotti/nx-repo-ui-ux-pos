name: Frontend CI & CD (GitHub Pages)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: Frontend CI (Lint, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint & Test Frontend
        run: npx nx run-many -t lint test -p frontend

      - name: Build Frontend for Production (GitHub Pages)
        run: npx nx build frontend --configuration=production --base-href=/${{ github.event.repository.name }}/

      - name: Create SPA 404 Fallback
        run: cp dist/apps/frontend/browser/index.html dist/apps/frontend/browser/404.html

      - name: Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/apps/frontend/browser

  deploy-frontend-pages:
    name: Deploy Frontend to GitHub Pages
    needs: frontend-ci
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Frontend to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
